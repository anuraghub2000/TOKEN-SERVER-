<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB4A Secure Login</title>
<style>
    :root { --bg:#18191A; --card:#242526; --text:#E4E6EB; --muted:#B0B3B8; --blue:#1877F2; --err:#F02849; --ok:#31A24C; }
    * { box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:15px; }
    .card { background:var(--card); width:100%; max-width:400px; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
    .tabs { display:flex; border-bottom:1px solid #3E4042; }
    .tab { flex:1; padding:15px; text-align:center; background:none; border:none; color:var(--muted); font-weight:bold; cursor:pointer; border-bottom:3px solid transparent; font-size: 14px;}
    .tab.active { color:var(--blue); border-bottom-color:var(--blue); }
    .content { padding:20px; }
    input { width:100%; padding:12px; margin-bottom:12px; background:var(--bg); border:1px solid #3E4042; border-radius:6px; color:#fff; outline:none; font-size: 14px;}
    input:focus { border-color:var(--blue); }
    button.action { width:100%; padding:12px; background:var(--blue); color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 15px;}
    button.action:disabled { opacity:0.6; cursor:not-allowed; }
    .hidden { display:none !important; }
    
    #status { margin-top:15px; padding:12px; border-radius:6px; font-size:13px; display:none; word-break: break-all;}
    #status.show { display:block; }
    #status.err { background:rgba(240,40,73,0.1); color:var(--err); border:1px solid var(--err); }
    #status.ok { background:rgba(49,162,76,0.1); color:var(--ok); border:1px solid var(--ok); }
    
    .spinner { width:30px; height:30px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; margin:15px auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .approval-box { text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div class="card">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('recover')">Forgot Password</button>
    </div>

    <div class="content">
        <!-- LOGIN FLOW -->
        <div id="view-login">
            <input type="text" id="l-user" placeholder="Email / Phone">
            <input type="password" id="l-pass" placeholder="Password">
            <button class="action" id="btn-login" onclick="doLogin()">Login</button>
            
            <!-- 2FA / Approval Box -->
            <div id="login-2fa" class="hidden">
                <!-- Notification Approval Box -->
                <div id="box-approval" class="approval-box hidden">
                    <div class="spinner"></div>
                    <p style="color:var(--muted); margin-bottom:5px;">Check your phone</p>
                    <p style="font-weight:bold;">Tap "Yes" or enter the number</p>
                    <button class="action" style="background:transparent; border:1px solid #3E4042; margin-top:15px;" onclick="showOTPBox()">Try another way (OTP)</button>
                </div>
                
                <!-- Manual OTP Box -->
                <div id="box-otp" class="hidden">
                    <input type="text" id="l-otp" placeholder="Enter 6-digit OTP">
                    <button class="action" onclick="submitOTP()">Verify OTP</button>
                </div>
            </div>
        </div>

        <!-- RECOVERY FLOW -->
        <div id="view-recover" class="hidden">
            <div id="rec-step1">
                <input type="text" id="r-email" placeholder="Email / Phone">
                <button class="action" id="btn-rec1" onclick="recSend()">Send Reset Code</button>
            </div>
            <div id="rec-step2" class="hidden">
                <input type="text" id="r-otp" placeholder="Enter Code">
                <input type="password" id="r-pass" placeholder="Set New Password">
                <button class="action" id="btn-rec2" onclick="recReset()">Reset & Login</button>
            </div>
        </div>

        <!-- STATUS -->
        <div id="status"></div>
    </div>
</div>

<script>
    let sessionId = null;
    let recoverId = null;
    let pollInterval = null;

    function switchTab(t) {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.content > div').forEach(v => v.classList.add('hidden'));
        document.getElementById(`view-${t}`).classList.remove('hidden');
        event.target.classList.add('active');
        document.getElementById('status').classList.remove('show');
    }

    function showStatus(msg, isErr = false) {
        const el = document.getElementById('status');
        el.innerText = msg;
        el.className = `show ${isErr ? 'err' : 'ok'}`;
    }

    function showOTPBox() {
        document.getElementById('box-approval').classList.add('hidden');
        document.getElementById('box-otp').classList.remove('hidden');
        if(pollInterval) clearInterval(pollInterval);
    }

    // --- LOGIN LOGIC ---
    async function doLogin() {
        const u = document.getElementById('l-user').value;
        const p = document.getElementById('l-pass').value;
        if(!u || !p) return showStatus("Enter credentials", true);

        const btn = document.getElementById('btn-login');
        btn.disabled = true; btn.innerText = "Connecting...";
        document.getElementById('status').classList.remove('show');

        try {
            const res = await fetch('/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();

            if(data.status === 'success') {
                showStatus("✅ Token: " + data.token);
            } else if(data.status === 'challenge') {
                sessionId = data.session_id;
                document.getElementById('login-2fa').classList.remove('hidden');
                
                if(data.type === 'approval') {
                    document.getElementById('box-approval').classList.remove('hidden');
                    startPolling();
                } else {
                    showOTPBox();
                }
            } else {
                showStatus("❌ " + data.message, true);
            }
        } catch(e) {
            showStatus("Network Error", true);
        } finally {
            btn.disabled = false; btn.innerText = "Login";
        }
    }

    function startPolling() {
        if(pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(async () => {
            try {
                const res = await fetch('/api/poll_approval', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({session_id: sessionId})
                });
                const data = await res.json();

                if(data.status === 'success') {
                    clearInterval(pollInterval);
                    showStatus("✅ Token: " + data.token);
                    document.getElementById('login-2fa').classList.add('hidden');
                } else if(data.status === 'error') {
                    clearInterval(pollInterval);
                    showStatus("❌ " + data.message, true);
                    document.getElementById('login-2fa').classList.add('hidden');
                }
            } catch(e) {}
        }, 4000);
    }

    async function submitOTP() {
        const otp = document.getElementById('l-otp').value;
        if(!otp) return showStatus("Enter OTP", true);

        const res = await fetch('/api/verify_otp', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({session_id: sessionId, otp: otp})
        });
        const data = await res.json();

        if(data.status === 'success') {
            showStatus("✅ Token: " + data.token);
            document.getElementById('login-2fa').classList.add('hidden');
        } else {
            showStatus("❌ " + data.message, true);
        }
    }

    // --- RECOVERY LOGIC ---
    async function recSend() {
        const email = document.getElementById('r-email').value;
        if(!email) return showStatus("Enter email/phone", true);

        const btn = document.getElementById('btn-rec1');
        btn.disabled = true; btn.innerText = "Sending...";

        try {
            const res = await fetch('/api/recover_send', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            });
            const data = await res.json();

            if(data.status === 'success') {
                recoverId = data.recover_id;
                document.getElementById('rec-step1').classList.add('hidden');
                document.getElementById('rec-step2').classList.remove('hidden');
                showStatus("OTP Sent! Check your SMS/Email.");
            } else {
                showStatus("❌ " + data.message, true);
            }
        } catch(e) {
            showStatus("Network Error", true);
        } finally {
            btn.disabled = false; btn.innerText = "Send Reset Code";
        }
    }

    async function recReset() {
        const otp = document.getElementById('r-otp').value;
        const pass = document.getElementById('r-pass').value;
        if(!otp || !pass) return showStatus("Enter Code & New Password", true);

        const btn = document.getElementById('btn-rec2');
        btn.disabled = true; btn.innerText = "Verifying...";

        try {
            const vRes = await fetch('/api/recover_verify', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({recover_id: recoverId, otp: otp})
            });
            const vData = await vRes.json();

            if(vData.status !== 'success') {
                showStatus("❌ " + vData.message, true);
                btn.disabled = false; btn.innerText = "Reset & Login";
                return;
            }

            btn.innerText = "Resetting & Logging in...";
            const rRes = await fetch('/api/recover_reset_login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({recover_id: recoverId, new_password: pass})
            });
            const rData = await rRes.json();

            if(rData.status === 'success') {
                showStatus("✅ " + rData.message + " Token: " + rData.token);
            } else {
                showStatus("❌ " + rData.message, true);
            }
        } catch(e) {
            showStatus("Network Error", true);
        } finally {
            btn.disabled = false; btn.innerText = "Reset & Login";
        }
    }
</script>
</body>
</html>
